CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
# Increase log buffer to avoid dropped messages during burst loopback
CONFIG_LOG_BUFFER_SIZE=4096

# USB device stack (device_next)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_ADB_CLASS=y
CONFIG_USBD_ADB_LOG_LEVEL_DBG=y

# System work queue stack: echo_work_fn calls usbd_adb_write() which
# iterates STRUCT_SECTION — needs a bit more stack than the default 1024.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# HWINFO for optional serial number descriptor
CONFIG_HWINFO=y
# Increase UDC buffer pool so we can allocate 4096 byte RX buffers
CONFIG_UDC_BUF_POOL_SIZE=16384
CONFIG_RING_BUFFER=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_DUMMY=n
# ls/cat/etc. for browsing the LittleFS mount from `adb shell`
CONFIG_FILE_SYSTEM_SHELL=y

# LittleFS on internal flash (storage_partition, 64 KB at 0xf0000)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
# The SoC's on-chip flash node declares write-block-size = 128 (the MCXN23x
# ROM Flash API only programs in 128-byte pages, see nxp_mcxn23x_common.dtsi).
# read/prog size MUST be a multiple of that or every littlefs write silently
# fails with -EINVAL from FLASH_Program while lfs_format()'s own writes still
# limp through, making the mount look fine until the first real file write.
CONFIG_FS_LITTLEFS_READ_SIZE=128
CONFIG_FS_LITTLEFS_PROG_SIZE=128
CONFIG_FS_LITTLEFS_CACHE_SIZE=128
# lfs_format() needs ~3KB of stack; default main stack is only 1KB
CONFIG_MAIN_STACK_SIZE=4096
