CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
# Increase log buffer to avoid dropped messages during burst loopback
CONFIG_LOG_BUFFER_SIZE=4096

# USB device stack (device_next)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_ADB_CLASS=y
CONFIG_USBD_ADB_LOG_LEVEL_DBG=y

# System work queue stack: echo_work_fn calls usbd_adb_write() which
# iterates STRUCT_SECTION — needs a bit more stack than the default 1024.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# HWINFO for optional serial number descriptor
CONFIG_HWINFO=y
# Increase UDC buffer pool so we can allocate 4096 byte RX buffers
CONFIG_UDC_BUF_POOL_SIZE=16384
CONFIG_RING_BUFFER=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_DUMMY=n
